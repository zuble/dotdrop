[project]
name = 'dotdrop'
description = 'Save your dotfiles once, deploy them everywhere'
readme = 'README.md'
authors = [ {name = 'deadc0de6', email = 'deadc0de6@foo.bar'}, ]
license = 'GPL-3.0-or-later'
requires-python = ">=3"
classifiers = [
    'Development Status :: 5 - Production/Stable',
    'Programming Language :: Python :: 3.6',
    'Programming Language :: Python :: 3.7',
    'Programming Language :: Python :: 3.8',
    'Programming Language :: Python :: 3.9',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
]
keywords = ['dotfiles', 'jinja2']
dependencies = [
    'Jinja2',
    'distro',
    'docopt-ng',
    'packaging',
    'python-magic',
    'requests',
    'ruamel.yaml',
    'tomli; python_version < "3.11"',
    'tomli_w',
    'setuptools'
]
dynamic = ['version']

[project.urls]
Documentation = 'https://dotdrop.readthedocs.io'
Repository = 'https://github.com/deadc0de6/dotdrop'

[project.optional-dependencies]
dev = ['check-manifest']
test = ['coverage', 'pytest', 'pytest-cov']

[project.scripts]
dotdrop = 'dotdrop:main'

[tool.hatch.version]
path = "dotdrop/version.py"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

## ------------------
## PIXI
[tool.pixi.workspace]
name = "dotdrop"
version = "1.15.0"
channels = ["conda-forge", "pypi"]
platforms = ["linux-64"]
preview = ["pixi-build"]

[tool.pixi.pypi-dependencies]
dotdrop = { path = ".", editable = true }

[tool.pixi.package]
name = { workspace = true }
version = { workspace = true }

[tool.pixi.package.build]
backend = { name = "pixi-build-python", version = "*" }

[tool.pixi.package.build-dependencies]
hatchling = "*"

[tool.pixi.package.host-dependencies]
hatchling = "*"
